[project]
name = "multi-agent-crypto"
version = "0.1.0"
description = "Multi-agent LLM pipeline for crypto market analysis (financial/market/sentiment specialists, conflict validation, debate, and mediated decision)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.37.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "google-genai>=1.0.0",
    "pypdf>=5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["agents", "utils", "rag", "data_sources", "app"]
omit = ["*/__pycache__/*"]
