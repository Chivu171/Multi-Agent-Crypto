[project]
name = "multi-agent-crypto"
version = "0.1.0"
description = "Multi-agent LLM pipeline for crypto market analysis (financial/market/sentiment specialists, conflict validation, debate, and mediated decision)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.37.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = []
